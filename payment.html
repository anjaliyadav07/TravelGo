<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#eef3ff;
}

.card{
max-width:600px;
margin:60px auto;
padding:30px;
border-radius:20px;
}

.pay-option{
cursor:pointer;
padding:15px;
border:2px solid #ddd;
border-radius:12px;
margin-bottom:15px;
transition:.3s;
}

.pay-option:hover{
border-color:#0d6efd;
background:#f8fbff;
}
</style>

</head>
<body>

<div class="card shadow">

<h2 class="mb-4 text-center">
Payment
</h2>

<div class="pay-option">
💳 Credit / Debit Card
</div>

<div class="pay-option">
📱 UPI
</div>

<div class="pay-option">
🏦 Net Banking
</div>

<div class="pay-option">
👛 Wallet
</div>

<button
class="btn btn-success w-100 mt-3"
onclick="payNow()">

Pay Now

</button>

</div>

<script>

function payNow(){

setTimeout(()=>{

window.location="success.html";

},1500);

}

</script>

</body>
</html>
