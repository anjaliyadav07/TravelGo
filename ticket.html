<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Your Ticket</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef4ff;
font-family:Arial,sans-serif;
}

.ticket{
max-width:900px;
margin:40px auto;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.ticket-header{
background:#0d6efd;
color:white;
padding:25px;
display:flex;
justify-content:space-between;
align-items:center;
}

.ticket-body{
padding:30px;
}

.label{
font-size:13px;
color:#666;
font-weight:bold;
}

.value{
font-size:18px;
font-weight:bold;
margin-bottom:20px;
}

.status{
display:inline-block;
padding:8px 18px;
background:#198754;
color:white;
border-radius:25px;
}

hr{
border-top:2px dashed #bbb;
}

</style>

</head>

<body>

<div id="ticket"></div>

<script>

const bookings=JSON.parse(localStorage.getItem("bookings"))||[];

const b=bookings[bookings.length-1];

if(!b){

document.getElementById("ticket").innerHTML=`
<div class="container mt-5">
<div class="alert alert-warning">
No Ticket Found
</div>
</div>
`;

}

else{

const flight=b.flight||{};

document.getElementById("ticket").innerHTML=`

<div class="ticket">

<div class="ticket-header">

<div>

<h2>✈ TravelGo</h2>

BOARDING PASS

</div>

<div>

<h2>${flight.airline}</h2>

</div>

</div>

<div class="ticket-body">

<div class="row">

<div class="col-md-4">

<div class="label">Passenger</div>

<div class="value">${b.passenger}</div>

</div>

<div class="col-md-4">

<div class="label">PNR</div>

<div class="value">${b.pnr}</div>

</div>

<div class="col-md-4">

<div class="label">Flight</div>

<div class="value">${flight.flight}</div>

</div>

</div>

<hr>

<div class="row">

<div class="col-md-3">

<div class="label">From</div>

<div class="value">${flight.from}</div>

</div>

<div class="col-md-3">

<div class="label">To</div>

<div class="value">${flight.to}</div>

</div>

<div class="col-md-3">

<div class="label">Departure</div>

<div class="value">${flight.depart}</div>

</div>

<div class="col-md-3">

<div class="label">Arrival</div>

<div class="value">${flight.arrive}</div>

</div>

</div>

<hr>

<div class="row">

<div class="col-md-3">

<div class="label">Seat</div>

<div class="value">${b.seat}</div>

</div>

<div class="col-md-3">

<div class="label">Gate</div>

<div class="value">${b.gate}</div>

</div>

<div class="col-md-3">

<div class="label">Boarding</div>

<div class="value">${b.boarding}</div>

</div>

<div class="col-md-3">

<div class="label">Status</div>

<div class="status">CONFIRMED</div>

</div>

</div>

<hr>

<div class="row align-items-center">

<div class="col-md-6">

<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${b.pnr}">

</div>

<div class="col-md-6 text-end">

<button class="btn btn-primary" onclick="window.print()">

🖨 Print Ticket

</button>

</div>

</div>

</div>

</div>

`;

}

</script>

</body>
</html>
