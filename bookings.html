<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Boarding Pass</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef4ff;
font-family:Arial,Helvetica,sans-serif;
}

.ticket{
max-width:900px;
margin:40px auto;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.ticket-header{
background:#0d6efd;
color:#fff;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.ticket-body{
padding:30px;
}

.section{
margin-bottom:25px;
}

.row div{
margin-bottom:15px;
}

.label{
font-size:13px;
color:#666;
font-weight:bold;
}

.value{
font-size:18px;
font-weight:600;
}

.confirmed{
background:#198754;
color:white;
padding:6px 15px;
border-radius:20px;
display:inline-block;
}

.print-btn{
margin-top:20px;
}

hr{
border-top:2px dashed #aaa;
}

</style>

</head>

<body>

<div id="tickets"></div>

<script>

const bookings = JSON.parse(localStorage.getItem("bookings")) || [];

const container = document.getElementById("tickets");

if(bookings.length===0){

container.innerHTML=`
<div class="container mt-5">

<div class="alert alert-warning text-center">

No Tickets Found

</div>

</div>
`;

}

else{

bookings.forEach((b,index)=>{

const flight=b.flight||{};

container.innerHTML+=`

<div class="ticket">

<div class="ticket-header">

<div>

<h2>✈ TravelGo</h2>

<div>BOARDING PASS</div>

</div>

<div>

<h4>${flight.airline || "TravelGo Airlines"}</h4>

</div>

</div>

<div class="ticket-body">

<div class="row">

<div class="col-md-4">

<div class="label">Passenger</div>

<div class="value">${b.passenger || "-"}</div>

</div>

<div class="col-md-4">

<div class="label">PNR</div>

<div class="value">${b.pnr || "-"}</div>

</div>

<div class="col-md-4">

<div class="label">Flight</div>

<div class="value">${flight.flight || "TG-101"}</div>

</div>

</div>

<hr>

<div class="row">

<div class="col-md-3">

<div class="label">From</div>

<div class="value">${flight.from || "-"}</div>

</div>

<div class="col-md-3">

<div class="label">To</div>

<div class="value">${flight.to || "-"}</div>

</div>

<div class="col-md-3">

<div class="label">Departure</div>

<div class="value">${flight.depart || "-"}</div>

</div>

<div class="col-md-3">

<div class="label">Arrival</div>

<div class="value">${flight.arrive || "-"}</div>

</div>

</div>

<hr>

<div class="row">

<div class="col-md-3">

<div class="label">Seat</div>

<div class="value">${b.seat || "-"}</div>

</div>

<div class="col-md-3">

<div class="label">Gate</div>

<div class="value">${b.gate || "-"}</div>

</div>

<div class="col-md-3">

<div class="label">Boarding</div>

<div class="value">${b.boarding || "-"}</div>

</div>

<div class="col-md-3">

<div class="label">Status</div>

<div class="confirmed">CONFIRMED</div>

</div>

</div>

<hr>

<div class="row">

<div class="col-md-6">

<div class="label">QR Code</div>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${b.pnr || "TravelGo"}">

</div>

<div class="col-md-6 text-end">

<button class="btn btn-primary print-btn" onclick="window.print()">

🖨 Print Ticket

</button>

</div>

</div>

</div>

</div>

`;

});

}

</script>

</body>
</html>
