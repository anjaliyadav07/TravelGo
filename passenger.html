<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Passenger Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fb;
}

.card{
max-width:700px;
margin:auto;
margin-top:60px;
padding:30px;
border-radius:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="card shadow">

<h2 class="mb-4">

Passenger Details

</h2>

<input
id="name"
class="form-control mb-3"
placeholder="Passenger Name">

<input
id="age"
type="number"
class="form-control mb-3"
placeholder="Age">

<select
id="gender"
class="form-select mb-3">

<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

<select
id="seat"
class="form-select mb-4">

<option>Window Seat</option>
<option>Middle Seat</option>
<option>Aisle Seat</option>

</select>

<button
class="btn btn-primary w-100"
onclick="confirmBooking()">

Confirm Booking

</button>

</div>

</div>

<script>

function confirmBooking(){

const flightId = Number(localStorage.getItem("selectedFlight"));

const flights = JSON.parse(localStorage.getItem("searchResults")) || [];

const flight = flights.find(f => f.id === flightId);

const booking = {

passenger: document.getElementById("name").value,

age: document.getElementById("age").value,

gender: document.getElementById("gender").value,

seat: document.getElementById("seat").value,

pnr: "TG" + Math.floor(Math.random() * 900000 + 100000),

gate: "A" + Math.floor(Math.random() * 12 + 1),

boarding: "08:45 AM",

flight: flight

};

let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

bookings.push(booking);

localStorage.setItem("bookings", JSON.stringify(bookings));

window.location = "payment.html";

}

</script>

</body>
</html>
